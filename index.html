<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖尿病年會影片筆記</title>
<meta name="description" content="ADA 2026 與 ATTD 2026 年會回顧影片的中文分段重點筆記，點時間即可跳到影片對應秒數。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf9; --ink:#22262b; --muted:#646b73; --line:#e2ddd3;
  --accent:#0f6e6a; --accent-soft:#dcefed; --warn:#8a5a12; --warn-soft:#fbf0dc;
  --chip:#eef3f2; --now:#fff4cc; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181b; --panel:#1d2125; --ink:#e7e9ea; --muted:#9aa2a9; --line:#30363c;
  --accent:#5cc8c0; --accent-soft:#1d3a38; --warn:#e7b56a; --warn-soft:#3a2f1c;
  --chip:#252b30; --now:#3a3420; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1d2125; --ink:#e7e9ea; --muted:#9aa2a9; --line:#30363c;
  --accent:#5cc8c0; --accent-soft:#1d3a38; --warn:#e7b56a; --warn-soft:#3a2f1c;
  --chip:#252b30; --now:#3a3420; --shadow:none;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{padding:22px 0 10px}
header h1{margin:0;font-size:1.5rem;letter-spacing:.02em}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.toolbar{display:flex;gap:10px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* video picker */
.picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:10px 0 18px}
.vcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;box-shadow:var(--shadow);min-width:0}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--chip)}
.vcard .g{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.vcard .t{font-size:.86rem;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard .m{font-size:.74rem;color:var(--muted)}
.vcard[aria-current="true"]{border-color:var(--accent);outline:2px solid var(--accent)}
@media (max-width:900px){.picker{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.vcard{flex:0 0 62%;scroll-snap-align:start}}

/* main layout */
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;padding-bottom:60px}
.left{position:sticky;top:12px}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.nowbar{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);margin:8px 2px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px;box-shadow:var(--shadow)}
.panel h2{font-size:1.02rem;margin:0 0 8px}
.vtitle{font-size:1.25rem;margin:14px 0 2px;line-height:1.4}
.vsub{color:var(--muted);font-size:.85rem;margin:0}
.summary{margin:10px 0 0}
.take{list-style:none;padding:0;margin:0}
.take li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line)}
.take li:first-child{border-top:0}
.ts{flex:none;display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;border:1px solid transparent;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;cursor:pointer;line-height:1.8}
.ts:hover{border-color:var(--accent)}
.ts::before{content:"▶";font-size:.6rem}
.yt{font-size:.75rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.yt:hover{color:var(--accent);text-decoration:underline}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;position:sticky;top:0;background:var(--bg);z-index:2;padding-top:4px}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;scroll-margin-top:60px;transition:background .3s}
.sec.now{background:var(--now)}
.sec h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 4px;font-size:1rem}
.sec ul{margin:4px 0 0;padding-left:1.2em}
.sec li{margin:2px 0}
.gl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.gl dt{font-weight:700}
.gl dt small{display:block;font-weight:400;color:var(--muted)}
.gl dd{margin:0;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.caveat{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:.9rem;margin-top:12px}
mark{background:#ffe27a;color:#222;border-radius:3px;padding:0 1px}
.results{list-style:none;margin:0;padding:0}
.results li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.results .src{font-size:.78rem;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding:16px 0 70px}
.hide{display:none!important}
select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;max-width:100%}
.trbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.85rem;color:var(--muted)}
.trbar input[type=search]{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.trbar button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer}
.trbar label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
#trBody{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.tp{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;margin:0;border-bottom:1px solid var(--line);line-height:1.65;scroll-margin-top:60px;border-radius:6px;transition:background .3s}
.tp:last-child{border-bottom:0}
.tp.now{background:var(--now)}
.tp.flash{outline:2px solid var(--accent)}
.tp .sp{display:block;height:6px}
.tp .tx{flex:1;min-width:0}
mark.cur{background:#ff9d3d}
.results .tx{font-size:.95rem;line-height:1.65}
.results .acts{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.results .ctx{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:1px 10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.kind{display:inline-block;font-size:.7rem;font-weight:700;padding:0 7px;border-radius:99px;margin-right:6px;background:var(--chip);color:var(--muted)}
.kind.tr{background:var(--accent-soft);color:var(--accent)}
.more{text-align:center;padding:10px}
.more button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 16px;cursor:pointer}
@media (max-width:900px){.toolbar select{flex:1 1 40%;min-width:0}.search{flex-basis:100%}}
@media (max-width:900px){.tp{scroll-margin-top:calc(100vw * 9 / 16 + 56px)}}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  .left{display:contents}
  .vcard{flex-basis:44%}
  .player-sticky{position:sticky;top:0;z-index:5;margin:0 -16px;background:#000}
  .player{border-radius:0}
  .tabs{top:calc(100vw * 9 / 16)}
  .sec{scroll-margin-top:calc(100vw * 9 / 16 + 56px)}
  header h1{font-size:1.25rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>糖尿病年會影片筆記｜ADA 2026 × ATTD 2026</h1>
    <p>五部年會回顧影片的中文分段重點。點任何 <span class="ts" style="cursor:default">0:00</span> 時間，影片就跳到那一段開始播放。</p>
  </header>

  <div class="toolbar">
    <div class="search"><input id="q" type="search" placeholder="搜尋逐字稿與筆記，中英文都可：血酮、低血糖、tirzepatide、screening…" aria-label="搜尋"></div>
    <select id="fScope" aria-label="搜尋範圍">
      <option value="all">逐字稿＋筆記</option>
      <option value="tr" data-tr>只搜逐字稿</option>
      <option value="notes">只搜中文筆記</option>
    </select>
    <select id="fVideo" aria-label="篩選影片"><option value="">全部影片</option></select>
  </div>

  <nav class="picker" id="picker" aria-label="選擇影片"></nav>

  <section id="searchView" class="hide" aria-live="polite">
    <h2 id="searchTitle" style="font-size:1.05rem"></h2>
    <ul class="results" id="results"></ul>
  </section>

  <main class="layout" id="videoView">
    <div class="left">
      <div class="player-sticky">
        <div class="player"><div id="yt"></div></div>
      </div>
      <div class="nowbar"><span id="nowSec">目前段落：—</span><a id="ytLink" class="yt" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>
      <h2 class="vtitle" id="vtitle"></h2>
      <p class="vsub" id="vsub"></p>
      <div class="panel">
        <h2>整體摘要</h2>
        <p class="summary" id="summary"></p>
      </div>
      <div class="panel">
        <h2>必記重點</h2>
        <ul class="take" id="take"></ul>
      </div>
    </div>

    <div class="right">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="false" data-tab="tr" data-tr>逐字稿</button>
        <button role="tab" aria-selected="true" data-tab="secs">分段筆記</button>
        <button role="tab" aria-selected="false" data-tab="gloss">名詞解釋</button>
      </div>
      <div id="tr" class="hide">
        <div class="trbar">
          <input id="trq" type="search" placeholder="在這部影片的逐字稿中尋找…" aria-label="在本片逐字稿中尋找">
          <span id="trCount"></span>
          <button id="trPrev" title="上一個">↑</button><button id="trNext" title="下一個">↓</button>
          <label><input type="checkbox" id="follow" checked> 跟著播放捲動</label>
        </div>
        <div id="trBody"></div>
      </div>
      <div id="secs"></div>
      <div id="gloss" class="hide"></div>
      <div class="caveat" id="caveat"></div>
    </div>
  </main>

  <footer>
    本站筆記為中文改寫整理，依影片自動字幕摘要，可能有辨識或翻譯誤差；臨床決策請以 ADA《Standards of Care》原文、台灣糖尿病學會指引與主治醫師判斷為準。
    需要英文逐字內容時，請在播放器按「CC 字幕」。影片版權屬原頻道所有，本站僅以 YouTube 官方嵌入播放。
  </footer>
</div>

<script src="data.js?v=5"></script>
<script src="transcript.js?v=5" onerror="window.TRANSCRIPTS=null"></script>
<script src="app.js?v=5"></script>
<script src="https://www.youtube.com/iframe_api" async></script>
<script src="https://mattsue1003.github.io/oth-report-button/report.js" data-site="糖尿病年會影片筆記" defer></script>
<script>
window.addEventListener('load',function(){
  (function shrink(n){
    var host=document.querySelector('[data-oth-report]');
    if(!host||!host.shadowRoot){if(n<20)setTimeout(function(){shrink(n+1)},300);return}
    var s=document.createElement('style');
    s.textContent='.fab{left:14px!important;right:auto!important;bottom:14px!important;width:34px!important;height:34px!important;min-width:0!important;padding:0!important;gap:0!important;justify-content:center!important;border-radius:50%!important;overflow:hidden!important;font-size:0!important;white-space:nowrap!important;opacity:.75}.fab svg{width:16px!important;height:16px!important;flex:none;margin:0!important}@media (hover:hover){.fab:hover{width:auto!important;padding:0 14px!important;gap:6px!important;font-size:13px!important;border-radius:99px!important;opacity:1}}';
    host.shadowRoot.appendChild(s);
  })(0);
});
</script>
</body>
</html>
